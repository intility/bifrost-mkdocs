name: Documentation (reusable)

# Centralizes the Zensical version, CLI flags, and pinned action SHAs for
# building and deploying Bifrost Zensical docs sites. Our own deploy-docs.yml
# calls this, so every release tests it; consumers call it directly:
#
#   jobs:
#     docs:
#       uses: intility/bifrost-zensical/.github/workflows/docs.yml@intility-bifrost-zensical-v0.1.0 # x-release-please-version

on:
  workflow_call:
    inputs:
      config-file:
        description: Path to the MkDocs/Zensical config file.
        type: string
        default: mkdocs.yml
      python-version:
        description: Python version to build with.
        type: string
        default: '3.13'
      install:
        description: >-
          Package spec (or pip arguments) that installs the theme. Consumers
          who add plugins override with `-r requirements.txt` or their own
          package spec.
        type: string
        default: intility-bifrost-zensical
      deploy:
        description: Deploy the built site to GitHub Pages.
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: uv venv && uv pip install ${{ inputs.install }}

      - name: Build site
        run: uv run zensical build --strict -f ${{ inputs.config-file }}

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'site'

  deploy:
    name: Deploy
    if: inputs.deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
