[project]
name = "intility-bifrost-zensical"
version = "0.1.2"
description = "Intility Bifrost theme for Zensical"
authors = [
    { name = "Erlend Ellefsen", email = "erlend.ellefsen@intility.no" },
]
keywords = [
    "zensical",
    "zensical-theme",
    "documentation",
    "bifrost",
    "intility",
    "theme",
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "zensical==0.0.59",
    "markdown-callouts>=0.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.0",
    "pytest>=9.0.0",
]

[project.urls]
Homepage = "https://intility.github.io/bifrost-zensical"
Documentation = "https://intility.github.io/bifrost-zensical"
Repository = "https://github.com/intility/bifrost-zensical"
Issues = "https://github.com/intility/bifrost-zensical/issues"
Changelog = "https://github.com/intility/bifrost-zensical/blob/main/CHANGELOG.md"
"Migrating from bifrost-mkdocs" = "https://intility.github.io/bifrost-zensical/migrating/"

[project.entry-points."mkdocs.themes"]
intility-bifrost = "intility_bifrost_zensical.theme"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intility_bifrost_zensical = [
    "theme/*.yml",
    "theme/**/*.html",
    "theme/**/*.css",
    "theme/**/*.js",
    "theme/**/*.woff2",
    # Bundled-font licenses must ship alongside the woff2 (SIL OFL requirement).
    "theme/**/fonts/*.txt",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["intility_bifrost_zensical"]

[tool.pytest.ini_options]
testpaths = ["tests"]
